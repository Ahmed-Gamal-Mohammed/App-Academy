<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cheat sheet for Table</title>
</head>
<body>
    <h1>My Cheat sheet for Table</h1>

    <!-- For creating the table we use <table> tag -->
    <table>
        <!-- thead ====> for creating the head of the table -->
        <thead>
            <!-- tr ====> for creating the row of the table -->
            <tr>
                <!-- th ====> here just for blod the font of the head -->
                <th scope="col">Insect</th>
                <th scope="col">Family</th>
                <th scope="col">Fact</th>
            </tr>
        </thead>

        <!--This is the body of the table  -->
        <tbody>
            <!-- tr for each row -->
            <tr>
                <th scope="row">Ladybug</th>
                <!-- td ===> is for each cell on the table -->
                <td>Coccinellidea</td>
                <td>Can eat more than 5,000 insects</td>

            </tr>
                <th scope="row">Fruit files</th>

                <td>Drosophilidea</td>
                <td>First Living creatures in outer space!</td>
            <tr>
                <th scope="row">Caterpillars</th>
                <td>Heterobathmiidae</td>
                <td>Have 12 eyes!</td>
            </tr>
        </tbody>

        <!-- The following is the foot of the table -->
        <tfoot>
            <tr>
                <td></td>
                <td>I has no ideas</td>
                <td>Those are neat!</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
