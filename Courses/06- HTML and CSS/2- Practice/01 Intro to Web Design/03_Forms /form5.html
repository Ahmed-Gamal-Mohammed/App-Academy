<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The HTML5 input types</title>
</head>
<body>
    <h1>The HTML5 input types</h1>
    <label for="email"> Enter your email address:</label><br />
    <input type="email" id="email" name="email" /><br /><br />



    <label for="search">Enter a search term:</label><br />
    <input type="search" id="search" name="search" /><br /><br />




    <label for="tel">Enter a telephone number:</label><br />
    <input type="tel" id="tel" name="tel" /><br /><br />




    <label for="url">Enter a URL:</label><br />
    <input type="url" id="url" name="url" /><br /><br />




    <label for="number">Enter a number:</label><br />
    <input type="number" id="number" name="number" /><br /><br />




    <label for="number">Enter an odd number between 1 and 10:</label><br />
    <input type="number" name="age" id="age" min="1" max="10" step="2" /><br /><br />



    <label for="number">Enter a number between 0 and 1, inclusive:</label><br />
    <input type="number" name="change" id="pennies" min="0" max="1" step="0.01" /><br /><br />




    <label for="price">Choose a maximum house price: </label><br /><br />
    <input type="range" name="price" id="price" min="50000" max="500000" step="1000" value="250000" />
    <output class="price-output" for="price"></output><br /><br />




    <label for="date">Enter the date:</label><br />
    <input type="date" name="date" id="date" /><br /><br />




    <label for="month">Enter the date and time:</label><br />
    <input type="datetime-local" name="datetime" id="datetime" /><br /><br />




    <label for="month">Enter the month:</label><br />
    <input type="month" name="month" id="month" /><br /><br />




    <label for="time">Enter a time:</label><br />
    <input type="time" name="time" id="time" /><br /><br />



    <label for="week">Enter the week:</label><br />
    <input type="week" name="week" id="week" /><br /><br />



    <label for="color">Pick a color:</label><br />
    <input type="color" name="color" id="color" /><br /><br />
</body>
</html>
