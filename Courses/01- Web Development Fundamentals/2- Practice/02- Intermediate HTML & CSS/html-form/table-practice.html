<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Practice</title>
</head>
<body>
  <h1>This is practice for Tables</h1>

  <!--
  / it's only for the head of the table , if you want to save the data in the head of the table
  thead  ==> Table head
  / all data write in the body of the table
  tbody
  / its for adding all the calc in one row ( foot ==> remmember footer)
  tfoot
  tr     ==> Tabel Row
  td     ==> Table data cell
  th     ==> Table header cell  (its make the header appears in blod font)

  -->
  <!-- it's not prefered to use the attributes like in table -->
  <table border="10" cellpadding = "12px">
    <caption>Students Marks</caption>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Marks</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Ahmed</td>
        <td>Gamal</td>
        <td>60</td>
      </tr>

      <tr>
        <td>Moahmed</td>
        <td>Emad</td>
        <td>64</td>
      </tr>

      <tr>
        <td>Yousuf</td>
        <td>Gamal</td>
        <td>30</td>
      </tr>

    </tbody>

    <tfoot>
      <tr>

        <td colspan="2">Total</td>
        <td>160</td>
      </tr>
    </tfoot>

  </table>

</body>
</html>
